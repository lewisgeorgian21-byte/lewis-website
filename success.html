<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <title>Message Sent ✔</title>

    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: "FiraGO", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Background Glow */
        .bg-glow {
            position: absolute;
            width: 420px;
            height: 420px;
            background: #2d80ff;
            filter: blur(120px);
            opacity: 0.45;
            border-radius: 50%;
            animation: float 6s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-60px); }
        }

        .success-box {
            text-align: center;
            padding: 45px 60px;
            background: rgba(20,20,20,0.7);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 18px;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0,140,255,0.28);
            animation: fadeIn 0.9s ease;
            position: relative;
            z-index: 100;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .check {
            font-size: 65px;
            margin-bottom: 15px;
            color: #2d80ff;
            animation: pop 0.6s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            margin: 0;
            font-size: 32px;
            color: #2d80ff;
            margin-bottom: 10px;
        }

        p {
            font-size: 17px;
            opacity: 0.85;
            margin-bottom: 28px;
        }

        a {
            display: inline-block;
            padding: 12px 26px;
            background: #2d80ff;
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-size: 17px;
            transition: 0.3s ease;
            box-shadow: 0 0 18px rgba(45,128,255,0.35);
        }

        a:hover {
            background: #1a5fd6;
            box-shadow: 0 0 28px rgba(45,128,255,0.55);
            transform: translateY(-3px);
        }

    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="success-box">
        <div class="check">✔</div>
        <h1>წერილი წარმატებით გაიგზავნა!</h1>
        <p>მალე დაგიკავშირდებით.</p>
        <a href="index.html">უკან დაბრუნება</a>
    </div>

</body>
</html>
